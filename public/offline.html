<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Data Detected — ViMore</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F2ECF7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1a1a1a;
    }

    .card {
      background: #ffffff;
      border-radius: 32px;
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 80px rgba(153, 64, 229, 0.12);
      border: 1px solid rgba(153, 64, 229, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    .logo {
      width: 72px;
      height: 72px;
      background: #9940E5;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 44px;
      height: 44px;
    }

    .icon-wrap {
      width: 80px;
      height: 80px;
      background: rgba(153, 64, 229, 0.06);
      border-radius: 24px;
      border: 2px dashed rgba(153, 64, 229, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-wrap svg {
      width: 36px;
      height: 36px;
      color: rgba(153, 64, 229, 0.4);
    }

    .text-block { display: flex; flex-direction: column; gap: 12px; }

    h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      font-style: italic;
      color: #1a1a1a;
      line-height: 1;
    }

    p {
      font-size: 14px;
      color: #888;
      font-weight: 500;
      line-height: 1.6;
      max-width: 320px;
      margin: 0 auto;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 20px 32px;
      background: #9940E5;
      color: #ffffff;
      text-decoration: none;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-style: italic;
      box-shadow: 0 12px 40px rgba(153, 64, 229, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      transform: scale(1.02);
      box-shadow: 0 16px 48px rgba(153, 64, 229, 0.45);
    }

    .btn:active { transform: scale(0.98); }

    .btn svg { width: 20px; height: 20px; flex-shrink: 0; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(153, 64, 229, 0.08);
      color: #9940E5;
      border: 1px solid rgba(153, 64, 229, 0.15);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: rgba(153, 64, 229, 0.06);
    }

    .footer-note {
      font-size: 10px;
      color: #bbb;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 7L10 19L17 7" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 15L17 7L21 15" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="#9940E5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.56 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
    </div>

    <div class="text-block">
      <div class="badge">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        No Data Detected
      </div>
      <h1>You're Offline</h1>
      <p>No network connection detected. Switch to Free Mode — a lightweight version optimised for low-data mobile networks like Orange &amp; MTN.</p>
    </div>

    <a href="https://free.vimore.cfd" class="btn">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
      Switch to Free Mode
    </a>

    <div class="divider"></div>
    <p class="footer-note">ViMore · Free Mode · Powered by Media Tech Liberia</p>
  </div>
</body>
</html>
